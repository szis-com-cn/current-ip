# Nginx 服务器配置文件
# 实现全局IP白名单控制和服务代理

server {
    listen 80;
    server_name localhost;

    # 全局IP访问控制
    # 只允许白名单中的IP访问所有服务
    include /etc/nginx/allowed_ips.conf;
    
    # 设置访问控制变量用于日志记录
    set $access_control "allowed";
    
    # 安全访问日志
    access_log /var/log/nginx/access.log security;
    error_log /var/log/nginx/error.log warn;

    # 安全头部设置
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 健康检查端点
    location /health {
        access_log off;
        return 200 '{"status":"healthy","service":"nginx-global-gateway","timestamp":"$time_iso8601"}';
        add_header Content-Type application/json;
    }

    # Webhook服务代理
    location /webhook {
        proxy_pass http://host.docker.internal:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 代理超时设置
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        
        # 只允许POST方法
        limit_except POST {
            deny all;
        }
    }

    # Nginx状态页面（仅限管理员IP访问）
    location /nginx-status {
        stub_status on;
        access_log off;
        
        # 限制访问IP（可根据需要调整）
        allow 127.0.0.1;
        allow ::1;
        deny all;
        
        add_header Content-Type text/plain;
    }

    # 默认根路径 - 显示欢迎页面
    location / {
        return 200 '{"message":"Nginx Global Gateway is running","status":"active","timestamp":"$time_iso8601","access_control":"enabled"}';
        add_header Content-Type application/json;
    }

    # 自定义错误页面
    error_page 403 @forbidden;
    location @forbidden {
        return 403 '{"error":"Access denied","message":"Your IP address is not in the whitelist","timestamp":"$time_iso8601"}';
        add_header Content-Type application/json;
    }

    # 5xx错误页面
    error_page 500 502 503 504 @server_error;
    location @server_error {
        return 500 '{"error":"Server error","message":"Internal server error occurred","timestamp":"$time_iso8601"}';
        add_header Content-Type application/json;
    }
}