services:
  webhook:
    container_name: ip-webhook-1
    build:
      context: .
      dockerfile: Dockerfile.webhook
    env_file:
      - .env
    ports:
      - "5000:5000"
    volumes:
      # 挂载配置文件目录
      - ./nginx-data:/nginx-data
      # 挂载日志目录
      - ./logs:/app/logs
      # 挂载Docker socket以便容器内可以执行docker命令
      - /var/run/docker.sock:/var/run/docker.sock
    # 移除用户限制，使用root用户以便访问Docker socket
    # user: "501:20"
    # 添加特权模式以确保能访问Docker socket
    privileged: true
    environment:
      TZ: Asia/Shanghai
      # Nginx 配置路径
      NGINX_CONFIG_PATH: ${NGINX_CONFIG_PATH:-/etc/nginx/conf.d/allowed_ips.conf}
      # Nginx 重载方式：external（外部nginx）、container（容器内）、command（自定义命令）
      NGINX_RELOAD_METHOD: ${NGINX_RELOAD_METHOD:-external}
      NGINX_CONTAINER_NAME: ${NGINX_CONTAINER_NAME:-nginx}
      NGINX_RELOAD_COMMAND: ${NGINX_RELOAD_COMMAND:-nginx -s reload}
      # 日志配置
      LOG_FILE: ${LOG_FILE:-/app/logs/webhook.log}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_MAX_SIZE: ${LOG_MAX_SIZE:-10485760}
      LOG_BACKUP_COUNT: ${LOG_BACKUP_COUNT:-5}
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge