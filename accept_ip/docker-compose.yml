services:
  nginx:
    container_name: ip-nginx-1
    build:
      context: .
      dockerfile: Dockerfile.nginx
    ports:
      - "88:80"
    volumes:
      - ./nginx-data:/etc/nginx/conf.d
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - webhook
    networks:
      - app-network
    restart: unless-stopped

  webhook:
    container_name: ip-webhook-1
    build:
      context: .
      dockerfile: Dockerfile.webhook
    ports:
      - "5000:5000"
    volumes:
      - ./nginx-data:/etc/nginx/conf.d
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TZ: Asia/Shanghai
      CRYPTO_SECRET_KEY: ${CRYPTO_SECRET_KEY:-your_secret_key_here}
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge